name: Controller Contract

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controller:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.x']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install controller dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-controller.txt
      - name: Run canonical Python and Node contracts
        run: python scripts/tests/run_controller_tests.py
      - name: Check repository diff whitespace
        run: git diff --check HEAD^ HEAD